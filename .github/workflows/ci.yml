# push마다 자동으로 돈다. 하나라도 실패하면 그 커밋에 빨간 X가 붙는다.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # 이미지를 GitHub 이미지 저장소(GHCR)에 올리기 위해

# 액션은 태그가 아니라 커밋 SHA로 고정한다. 태그는 소유자가 조용히 다른 커밋으로 옮길 수 있어,
# 액션 저장소가 탈취되면 우리 CI가 악성 코드를 실행하게 된다 (2025년 trivy-action 탈취 사건).

jobs:
  # 1. 빌드 + 테스트. 서비스마다 따로 돌려서 어느 쪽이 깨졌는지 바로 보이게 한다.
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, gateway]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      # Testcontainers는 Docker가 필요하다. GitHub의 ubuntu 러너에는 이미 Docker가 켜져 있다.
      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: ./gradlew test --no-daemon
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report-${{ matrix.service }}
          path: ${{ matrix.service }}/build/reports/tests/test

  # 2. 정적 분석(SAST). 코드를 실행하지 않고 패턴으로 취약점을 찾는다.
  semgrep:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan
        run: semgrep scan --config p/java --config p/secrets --config p/owasp-top-ten --error --exclude-rule java.lang.security.audit.spring-csrf-disabled

  # 3. 비밀값 탐지. 커밋 이력 전체에서 키·비밀번호 모양을 찾는다.
  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4. 이미지 취약점 스캔. 이미지 안의 OS 패키지와 자바 라이브러리에 알려진 취약점(CVE)이 있는지.
  trivy:
    name: trivy (${{ matrix.service }} image)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, gateway]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build -t ${{ matrix.service }}:ci ./${{ matrix.service }}
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.service }}:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # 5. 위 검사를 전부 통과했을 때만 이미지를 올린다. 하나라도 실패하면 이 단계는 실행되지 않는다 = 게이트.
  publish:
    name: publish (${{ matrix.service }} image)
    needs: [test, semgrep, gitleaks, trivy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, gateway]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./${{ matrix.service }}
          push: true
          # latest 와 커밋 SHA 두 개의 이름표를 붙인다. 문제 생기면 SHA로 특정 버전을 되돌릴 수 있다.
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

  # 6. 이미지가 올라간 뒤 서버에 "새 이미지 받아서 재시작"을 보낸다.
  #    SSH가 아니라 AWS SSM 원격 명령을 쓴다. 서버에 22번을 열지 않고도 배포할 수 있다.
  deploy:
    name: deploy to EC2
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Send deploy command
        id: send
        run: |
          CMD_ID=$(aws ssm send-command             --instance-ids "${{ vars.DEPLOY_INSTANCE_ID }}"             --document-name AWS-RunShellScript             --comment "deploy ${{ github.sha }}"             --parameters 'commands=["cd /opt/zero-trust && git pull --ff-only --quiet && docker compose -f docker-compose.prod.yml pull --quiet && docker compose -f docker-compose.prod.yml up -d --remove-orphans && docker image prune -f"]'             --query Command.CommandId --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
      - name: Wait for result
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation               --command-id "${{ steps.send.outputs.command_id }}"               --instance-id "${{ vars.DEPLOY_INSTANCE_ID }}"               --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut) 
                aws ssm get-command-invocation --command-id "${{ steps.send.outputs.command_id }}"                   --instance-id "${{ vars.DEPLOY_INSTANCE_ID }}" --query StandardErrorContent --output text
                exit 1 ;;
            esac
            sleep 10
          done
          echo "timed out"; exit 1
      - name: Smoke test
        run: |
          IP="${{ vars.DEPLOY_PUBLIC_IP }}"
          for i in $(seq 1 12); do
            CODE=$(curl -s -m 5 -o /dev/null -w "%{http_code}" -X POST "http://$IP:8080/auth/login" -H "Content-Type: application/json" -d '{"email":"x@x.com","password":"x"}' || true)
            echo "login endpoint -> $CODE"
            [ "$CODE" = "401" ] && exit 0
            sleep 10
          done
          exit 1

