# main에 push할 때마다 돈다. 하나라도 실패하면 파이프라인 전체가 실패로 표시된다.
# 서버 배포는 아직 GitHub Actions에 있다.

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - verify
  - build

# 1. 빌드 + 테스트. 서비스마다 따로 돌려서 어느 쪽이 깨졌는지 바로 보이게 한다.
test:
  stage: verify
  image: eclipse-temurin:21-jdk
  # Testcontainers는 Docker가 필요하다. GitHub 러너에는 Docker가 켜져 있었지만
  # GitLab의 작업은 컨테이너 안에서 돌기 때문에, Docker를 옆에 따로 띄워서 붙인다.
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  parallel:
    matrix:
      - SERVICE: [auth-service, gateway]
  script:
    - cd $SERVICE
    - ./gradlew test --no-daemon
  artifacts:
    when: always
    paths:
      - $SERVICE/build/reports/tests/test
    expire_in: 1 week

# 2. 정적 분석(SAST). 코드를 실행하지 않고 패턴으로 취약점을 찾는다.
semgrep:
  stage: verify
  image: semgrep/semgrep
  variables:
    # 이 이미지는 코드가 /src에 있다고 가정한다. GitLab은 코드를 다른 폴더에 받으므로 그 위치를 알려 준다.
    SEMGREP_SRC_DIRECTORY: $CI_PROJECT_DIR
  script:
    - semgrep scan --config p/java --config p/secrets --config p/owasp-top-ten --error

# 3. 비밀값 탐지. 커밋 이력 전체에서 키·비밀번호 모양을 찾는다.
gitleaks:
  stage: verify
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.24.3
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0   # 기본값은 최근 커밋 일부만 받아 온다. 0이면 이력 전체를 받는다.
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - gitleaks git --redact --verbose
    # gitleaks는 글자로 된 비밀값 모양을 찾는다. Terraform 계획 파일은 압축 파일이라 안에 비밀값이 평문으로 있어도 보지 못한다.
    # 그래서 올라오면 안 되는 파일은 내용이 아니라 이름으로 한 번 더 막는다.
    - |
      FOUND=$(git ls-files | grep -E '\.tfstate$|\.tfstate\.backup$|\.tfplan$|\.tfvars$|^infra/.*\.out$|(^|/)\.env$' || true)
      if [ -n "$FOUND" ]; then
        echo "올라오면 안 되는 파일이 저장소에 있습니다:"
        echo "$FOUND"
        exit 1
      fi

# 4. 이미지 만들기. 앞 단계의 검사가 전부 통과했을 때만 시작한다.
#    이미지는 여기서 한 번만 만든다. 뒤의 작업들은 다시 만들지 않고 여기서 적어 둔 다이제스트로 같은 이미지를 가리킨다.
build-image:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  parallel:
    matrix:
      - SERVICE: [auth-service, gateway]
  script:
    # 로그인 정보는 GitLab이 이 작업에만 쓰라고 만들어 준 것이다. 작업이 끝나면 못 쓴다.
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - IMAGE="$CI_REGISTRY_IMAGE/$SERVICE"
    - docker build -t "$IMAGE:$CI_COMMIT_SHA" "$SERVICE"
    - docker push "$IMAGE:$CI_COMMIT_SHA"
    # 다이제스트는 저장소에 올릴 때 정해진다. 파일에 적어 다음 작업에 넘긴다.
    - mkdir -p digests
    - docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$CI_COMMIT_SHA" > "digests/$SERVICE.txt"
    - cat "digests/$SERVICE.txt"
  artifacts:
    paths:
      - digests/
    expire_in: 1 week
