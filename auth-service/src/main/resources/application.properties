spring.application.name=auth-service
server.port=8081

# 프로젝트 루트의 .env 를 그대로 읽어온다 (docker-compose와 같은 값 공유). 없으면 무시.
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# 엔티티 클래스를 보고 테이블을 자동으로 만들거나 고친다 (개발 단계용)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60
refresh.expiration-days=14
# 폐기된 refresh가 이 시간 안에 다시 오면 탈취가 아니라 탭 겹침·재시도로 본다 (초)
refresh.reuse-grace-seconds=10

# 초기 관리자 계정 (.env에서 읽는다. 없으면 빈 값 = 만들지 않음)
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# 지표는 별도 포트(9091)로 낸다. 이 포트는 바깥에 열지 않고 Prometheus만 내부 네트워크에서 읽는다.
management.server.port=9091
# 검토 후 허용: prometheus 엔드포인트는 별도 포트(9091)에만 있고 그 포트는 방화벽과 compose에서 바깥에 열지 않는다.
# nosemgrep: java.spring.security.audit.spring-actuator-non-health-enabled.spring-actuator-dangerous-endpoints-enabled
management.endpoints.web.exposure.include=health,prometheus
management.prometheus.metrics.export.enabled=true

