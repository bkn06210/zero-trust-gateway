apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: app
          image: "{{ required "image.repository가 비어 있습니다" .Values.image.repository }}@{{ required "image.digest가 비어 있습니다. 이미지는 다이제스트로만 지정합니다" .Values.image.digest }}"
          ports:
            - name: http
              containerPort: {{ .Values.port }}
            - name: management
              containerPort: 9091
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.secretEnv }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: {{ . }}
            {{- end }}
          # 자바 서비스는 켜지는 데 수십 초가 걸린다. 다 켜질 때까지 최대 150초 기다린다.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 5
            failureThreshold: 30
          # 준비가 안 된 동안에는 요청을 보내지 않는다.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 10
          # 응답이 계속 없으면 죽은 것으로 보고 다시 띄운다.
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
