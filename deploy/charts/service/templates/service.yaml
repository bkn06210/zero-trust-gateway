# 파드는 죽으면 새로 만들어지고 그때마다 주소가 바뀐다.
# Service는 바뀌지 않는 이름을 하나 주고, 그 이름으로 온 요청을 살아 있는 파드에 넘긴다.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
