# 빈칸의 기본값. 서비스마다 다른 값은 deploy/values/ 아래 파일에서 덮어쓴다.

replicas: 1

image:
  repository: ""
  # 이름표가 아니라 다이제스트로만 지정한다. 비어 있으면 설치가 실패한다.
  digest: ""

# 서비스가 요청을 받는 포트
port: 8080

# 평문으로 넣어도 되는 환경 변수. 이름: 값
env: {}

# 비밀값으로 받을 환경 변수 이름 목록. secretName의 Secret에서 같은 이름의 값을 꺼낸다.
secretName: app-secrets
secretEnv: []

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi
