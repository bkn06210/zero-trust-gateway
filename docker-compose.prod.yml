# 서버용 compose. 소스를 빌드하지 않고 CI가 올려 둔 이미지를 받아서 쓴다.
# 로컬 개발용 docker-compose.yml과 구조는 같고, build 대신 image만 다르다.
services:
  gateway:
    image: ghcr.io/bkn06210/zero-trust-gateway/gateway:latest
    container_name: zero-trust-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SERVICES_AUTH_URL: http://auth-service:8081
      REDIS_HOST: redis
    depends_on:
      auth-service:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    image: ghcr.io/bkn06210/zero-trust-gateway/auth-service:latest
    container_name: zero-trust-auth
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: zero-trust-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zero-trust-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
