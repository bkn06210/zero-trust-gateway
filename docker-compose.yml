# 전체 스택. `docker compose up -d --build` 한 번으로 네 개가 뜬다.
# 바깥으로 여는 포트는 gateway의 8080 하나뿐이다. 나머지는 컨테이너끼리의 내부 네트워크에서만 통한다.
services:
  gateway:
    build: ./gateway
    container_name: zero-trust-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      # 컨테이너끼리는 localhost가 아니라 서비스 이름으로 서로를 찾는다.
      SERVICES_AUTH_URL: http://auth-service:8081
      REDIS_HOST: redis
    depends_on:
      auth-service:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    container_name: zero-trust-auth
    # ports 없음: gateway를 거치지 않고 직접 호출하는 길을 네트워크에서 닫는다.
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: zero-trust-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # "켜졌다"가 아니라 "접속을 받을 준비가 됐다"를 확인한다. auth-service는 이게 통과된 뒤에 뜬다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zero-trust-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
