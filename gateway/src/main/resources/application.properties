spring.application.name=gateway
server.port=8080

# 프로젝트 루트의 .env 를 읽어온다 (auth-service와 같은 JWT 비밀키 공유). 없으면 무시.
spring.config.import=optional:file:../.env[.properties]

# JWT 검증용 비밀키 (HS256은 발급과 검증에 같은 키를 쓴다)
jwt.secret=${JWT_SECRET}

# 요청을 넘겨줄 뒤쪽 서비스 주소
services.auth.url=http://localhost:8081

# 요청 횟수 제한에 쓰는 Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# 로그인 제한: 1분 창 안에서 (IP) 30회, (이메일+IP) 5회, (이메일) 20회
# IP 한도는 부하를 잴 때만 환경변수로 올린다. 측정 PC 한 대에서 보내는 요청이 전부 여기서 막히기 때문이다.
ratelimit.login.window-seconds=60
ratelimit.login.per-ip=${RATELIMIT_LOGIN_PER_IP:30}
ratelimit.login.per-email-ip=5
ratelimit.login.per-email=20

# 지표는 별도 포트(9091)로 낸다. 이 포트는 바깥에 열지 않고 Prometheus만 내부 네트워크에서 읽는다.
management.server.port=9091
# 검토 후 허용: prometheus 엔드포인트는 별도 포트(9091)에만 있고 그 포트는 방화벽과 compose에서 바깥에 열지 않는다.
# nosemgrep: java.spring.security.audit.spring-actuator-non-health-enabled.spring-actuator-dangerous-endpoints-enabled
management.endpoints.web.exposure.include=health,prometheus
management.prometheus.metrics.export.enabled=true

