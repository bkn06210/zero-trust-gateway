spring.application.name=gateway
server.port=8080

# 프로젝트 루트의 .env 를 읽어온다 (auth-service와 같은 JWT 비밀키 공유). 없으면 무시.
spring.config.import=optional:file:../.env[.properties]

# JWT 검증용 비밀키 (HS256은 발급과 검증에 같은 키를 쓴다)
jwt.secret=${JWT_SECRET}

# 요청을 넘겨줄 뒤쪽 서비스 주소
services.auth.url=http://localhost:8081

# 요청 횟수 제한에 쓰는 Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# 로그인 제한: 1분 창 안에서 (이메일+IP) 5회, (이메일) 20회
ratelimit.login.window-seconds=60
ratelimit.login.per-email-ip=5
ratelimit.login.per-email=20

