# 15초마다 각 서비스의 /actuator/prometheus 를 읽어 저장한다. 서비스 이름은 compose 내부 네트워크의 이름.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:9091"]

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:9091"]

  # 서버(호스트) 자체의 CPU, 메모리, 디스크
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
